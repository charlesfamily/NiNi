# Codemagic CI/CD — Nini Daily iOS build on a cloud Mac (no local Mac needed).
#
# Pipeline: macOS VM -> npm install -> Capacitor sync -> automatic code
# signing via the App Store Connect API key -> build number bump -> signed
# .ipa -> upload to TestFlight / App Store Connect.
#
# Placeholders resolved 2026-11-07:
#   * integrations.app_store_connect below matches the "Nini Daily ASC"
#     integration Charles created in the Codemagic UI.
#   * The APP_STORE_CONNECT_* and CERTIFICATE_PRIVATE_KEY values live in
#     Codemagic's encrypted environment variables, group "nini_secrets"
#     (App settings -> Environment variables, marked Secret), imported
#     into this workflow via environment.groups below.
#     NEVER commit the real .p8 private key to git.

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Placeholder name -- must match the integration label in Codemagic.
      app_store_connect: Nini Daily ASC
    environment:
      groups:
        - nini_secrets # APP_STORE_CONNECT_* + CERTIFICATE_PRIVATE_KEY (Codemagic vault)
      node: 22 # Capacitor 8 CLI requires Node >= 22
      xcode: latest
      vars:
        BUNDLE_ID: "app.ninidaily"
        XCODE_PROJECT: "ios/App/App.xcodeproj" # Capacitor 8 uses SPM -> project, not workspace
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync web app into the iOS project
        script: |
          npx cap sync ios
      - name: Set up automatic code signing (App Store Connect API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # use-profiles MUST run from inside ios/App with an explicit
          # --project: run from the repo root it silently patches nothing,
          # and the archive then fails with '"App" requires a provisioning
          # profile' (build #1, 2026-11-07).
          cd ios/App && xcode-project use-profiles --project App.xcodeproj
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true # first stop: TestFlight on Charles's iPhone
        submit_to_app_store: false # flip to true when ready for App Store review
