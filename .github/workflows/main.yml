    reference: "Joshua 1:9"
  },
]

export function RemindersView({ searchQuery }: RemindersViewProps) {
  const [reminders, setReminders] = useState<Reminder[]>(SAMPLE_REMINDERS)
  const [activeTab, setActiveTab] = useState<"affirmations" | "bible">("affirmations")
  const [currentItem, setCurrentItem] = useState(AFFIRMATIONS[0])
  const [currentIndex, setCurrentIndex] = useState(0)
  const [greeting, setGreeting] = useState("")

  useEffect(() => {
    const hour = new Date().getHours()
    if (hour < 12) setGreeting("Good morning")
    else if (hour < 17) setGreeting("Good afternoon")
    else setGreeting("Good evening")
  }, [])

  const getRandomIndex = (max: number, currentIdx: number) => {
    let newIndex = Math.floor(Math.random() * max)
    while (newIndex === currentIdx && max > 1) {
      newIndex = Math.floor(Math.random() * max)
    }
    return newIndex
  }

  const refreshContent = () => {
    if (activeTab === "affirmations") {
      const newIndex = getRandomIndex(AFFIRMATIONS.length, currentIndex)
      setCurrentIndex(newIndex)
      setCurrentItem(AFFIRMATIONS[newIndex])
    } else {
      const newIndex = getRandomIndex(BIBLE_VERSES.length, currentIndex)
      setCurrentIndex(newIndex)
      setCurrentItem(BIBLE_VERSES[newIndex])
    }
  }

  const handleTabChange = (value: string) => {
    const newTab = value as "affirmations" | "bible"
    setActiveTab(newTab)
    
    if (newTab === "affirmations") {
      const newIndex = Math.floor(Math.random() * AFFIRMATIONS.length)
      setCurrentIndex(newIndex)
      setCurrentItem(AFFIRMATIONS[newIndex])
    } else {
      const newIndex = Math.floor(Math.random() * BIBLE_VERSES.length)
      setCurrentIndex(newIndex)
      setCurrentItem(BIBLE_VERSES[newIndex])
    }
  }

  // Auto-rotate content every 30 seconds
  useEffect(() => {
    const interval = setInterval(() => {
      refreshContent()
    }, 30000)
    
    return () => clearInterval(interval)
  }, [activeTab, currentIndex])

  const filteredReminders = reminders.filter(reminder =>
    reminder.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
    reminder.description?.toLowerCase().includes(searchQuery.toLowerCase()) ||
    reminder.location?.toLowerCase().includes(searchQuery.toLowerCase())
  )

  const toggleReminder = (id: string) => {
    setReminders(reminders.map(reminder =>
      reminder.id === id ? { ...reminder, active: !reminder.active } : reminder
    ))
  }

  const deleteReminder = (id: string) => {
    setReminders(reminders.filter(reminder => reminder.id !== id))
  }

  const activeReminders = reminders.filter(r => r.active).length
  const recurringReminders = reminders.filter(r => r.recurring).length

  return (
    <div className="h-full p-4 md:p-6 space-y-6 overflow-auto">
      {/* App Header */}
      <motion.div 
        initial={{ opacity: 0, y: -20 }}
        animate={{ opacity: 1, y: 0 }}
        className="text-center mb-2"
      >
        <div className="flex items-center justify-center gap-2 mb-1">
          <Sparkles className="h-6 w-6 text-purple-500" />
          <h1 className="text-3xl md:text-4xl font-bold bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 bg-clip-text text-transparent">
            Nini
          </h1>
          <Sparkles className="h-6 w-6 text-purple-500" />
        </div>
        <p className="text-slate-500 dark:text-slate-400 text-sm">
          {greeting}! Your daily dose of inspiration ✨
        </p>
      </motion.div>

      {/* Daily Inspiration */}
      <Card className="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white overflow-hidden relative">
        <CardContent className="p-6 relative">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2">
              {activeTab === "affirmations" ? (
                <Heart className="h-5 w-5" />
              ) : (
                <BookOpen className="h-5 w-5" />
              )}
              <h3 className="font-semibold text-lg">
                {activeTab === "affirmations" ? "Today's Nini" : "Today's Verse"}
              </h3>
            </div>
            <Button
              variant="ghost"
              size="sm"
              className="text-white hover:bg-white/20"
              onClick={refreshContent}
            >
              <RefreshCw className="h-4 w-4 mr-1" />
              New
            </Button>
          </div>

          <div className="mb-6">
            <Tabs 
              value={activeTab} 
              onValueChange={handleTabChange}
              className="w-full"
            >
              <TabsList className="bg-white/10 backdrop-blur-sm w-full">
                <TabsTrigger 
                  value="affirmations" 
                  className="flex-1 data-[state=active]:bg-white/20 text-white"
                >
                  <Heart className="h-4 w-4 mr-2" />
                  Affirmations
                </TabsTrigger>
                <TabsTrigger 
                  value="bible" 
                  className="flex-1 data-[state=active]:bg-white/20 text-white"
                >
                  <BookOpen className="h-4 w-4 mr-2" />
                  Bible Verses
                </TabsTrigger>
              </TabsList>
            </Tabs>
          </div>

          <AnimatePresence mode="wait">
            <motion.div
              key={`${activeTab}-${currentIndex}`}
              initial={{ opacity: 0, y: 20 }}
              animate={{ opacity: 1, y: 0 }}
              exit={{ opacity: 0, y: -20 }}
              transition={{ duration: 0.3 }}
              className="text-center"
            >
              <p className="text-xl md:text-2xl font-light leading-relaxed mb-4 italic">
                "{currentItem.text}"
              </p>
              {'reference' in currentItem ? (
                <p className="text-sm text-white/80 font-medium">
                  — {currentItem.reference}
                </p>
              ) : (
                <p className="text-sm text-white/80 font-medium">
                  — {currentItem.author}
                </p>
              )}
            </motion.div>
          </AnimatePresence>

          {/* Decorative elements */}
          <div className="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/2" />
          <div className="absolute bottom-0 left-0 w-24 h-24 bg-white/5 rounded-full translate-y-1/2 -translate-x-1/2" />
        </CardContent>
      </Card>

      {/* Stats */}
      <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
        <Card>
          <CardContent className="p-4">
            <div className="text-2xl font-bold text-slate-900 dark:text-slate-100">{reminders.length}</div>
            <div className="text-sm text-slate-600 dark:text-slate-400">Total Reminders</div>
          </CardContent>
        </Card>
        <Card>
          <CardContent className="p-4">
            <div className="text-2xl font-bold text-green-600">{activeReminders}</div>
            <div className="text-sm text-slate-600 dark:text-slate-400">Active</div>
          </CardContent>
        </Card>
        <Card>
          <CardContent className="p-4">
            <div className="text-2xl font-bold text-purple-600">{recurringReminders}</div>
            <div className="text-sm text-slate-600 dark:text-slate-400">Recurring</div>
          </CardContent>
        </Card>
      </div>

      {/* Reminders List */}
      <div>
        <h3 className="text-lg font-semibold text-slate-900 dark:text-slate-100 mb-4">Your Reminders</h3>
        <div className="space-y-3">
          {filteredReminders.map((reminder, index) => (
            <motion.div
              key={reminder.id}
              initial={{ opacity: 0, x: -20 }}
              animate={{ opacity: 1, x: 0 }}
              transition={{ delay: index * 0.05 }}
            >
              <Card className={`${!reminder.active ? "opacity-60" : ""}`}>
                <CardContent className="p-4">
                  <div className="flex items-start gap-3">
                    <div className={`w-10 h-10 rounded-full ${reminder.color} flex items-center justify-center shrink-0`}>
                      <Bell className="h-5 w-5 text-white" />
                    </div>
                    <div className="flex-1 min-w-0">
                      <h4 className={`font-semibold mb-1 text-slate-900 dark:text-slate-100 ${!reminder.active ? "line-through" : ""}`}>
                        {reminder.title}
                      </h4>
                      {reminder.description && (
                        <p className="text-sm text-slate-600 dark:text-slate-400 mb-2">{reminder.description}</p>
                      )}
                      <div className="flex flex-wrap gap-2">
                        <Badge variant="outline" className="flex items-center gap-1">
                          <Clock className="h-3 w-3" />
                          {reminder.time}
                        </Badge>
                        {reminder.recurring && (
                          <Badge variant="outline" className="flex items-center gap-1">
                            <Repeat className="h-3 w-3" />
                            <span className="capitalize">{reminder.recurring}</span>
                          </Badge>
                        )}
                        {reminder.location && (
                          <Badge variant="outline" className="flex items-center gap-1">
                            <MapPin className="h-3 w-3" />
                            {reminder.location}
                          </Badge>
                        )}
                        <Badge className={reminder.active ? "bg-green-500 text-white" : "bg-slate-400 text-white"}>
                          {reminder.active ? "Active" : "Paused"}
                        </Badge>
                      </div>
                    </div>
                    <div className="flex gap-1 shrink-0">
                      <Button
                        variant="ghost"
                        size="icon"
                        onClick={() => toggleReminder(reminder.id)}
                        title={reminder.active ? "Pause reminder" : "Activate reminder"}
                        aria-label={reminder.active ? "Pause reminder" : "Activate reminder"}
                      >
                        <Bell className={`h-4 w-4 ${reminder.active ? "text-green-600" : "text-slate-400"}`} />
                      </Button>
                      <Button
                        variant="ghost"
                        size="icon"
                        onClick={() => deleteReminder(reminder.id)}
                        title="Delete reminder"
                        aria-label="Delete reminder"
                      >
                        <Trash2 className="h-4 w-4 text-slate-400 hover:text-red-600" />
                      </Button>
                    </div>
                  </div>
                </CardContent>
              </Card>
            </motion.div>
          ))}
          {filteredReminders.length === 0 && (
            <Card>
              <CardContent className="p-8 text-center text-slate-500 dark:text-slate-400">
                No reminders found
              </CardContent>
            </Card>
          )}
        </div>
      </div>

      {/* Quick Actions */}
      <Card className="bg-gradient-to-br from-blue-500 to-purple-600 text-white">
        <CardContent className="p-6">
          <h3 className="text-lg font-semibold mb-2">Nini Tips</h3>
          <ul className="space-y-2 text-sm">
            <li>• Set recurring reminders for daily habits</li>
            <li>• Add locations to get notified when you arrive</li>
            <li>• Pause reminders when you don't need them</li>
            <li>• Let Nini inspire you with daily affirmations and verses</li>
          </ul>
        </CardContent>
      </Card>
    </div>
  )
}
